version: "3.8"

services:
  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    volumes:
      - ./:/app/
    command: sh -c "chmod +x /app/entrypoint.sh && /app/entrypoint.sh"
    ports:
      - "8080:8080"
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend-api:8080/health" ]
      interval: 10s
      retries: 5
      start_period: 5s

  postgres:
    image: "postgres:13"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 5s

  redis:
    image: "redis:latest"
    expose:
      - "6379"
    networks:
      - backend_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: {}

networks:
  backend_network: {}
